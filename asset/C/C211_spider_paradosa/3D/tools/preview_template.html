<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pardosa idle 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181a20;color:#eef0f4;font:15px system-ui,sans-serif}
main{max-width:1450px;margin:auto;padding:28px}h1{font-size:24px;font-weight:600;margin:0 0 24px}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:18px}
label{display:flex;gap:8px;align-items:center}select,button{background:#303641;color:inherit;border:1px solid #707988;border-radius:5px;padding:8px;font:inherit}
button{cursor:pointer}input{accent-color:#c7a375}input[type=range]{width:160px}
.stage{display:flex;align-items:center;justify-content:center;min-height:660px;overflow:auto;border:1px solid #49505a;background-color:#525b67;background-image:linear-gradient(45deg,#596370 25%,transparent 25%),linear-gradient(-45deg,#596370 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#596370 75%),linear-gradient(-45deg,transparent 75%,#596370 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
canvas{image-rendering:pixelated;flex-shrink:0;margin:auto}.status{color:#bbc5d3;margin-top:15px}small{color:#bbc5d3}
@media(max-width:650px){main{padding:16px}.stage{min-height:350px}}
</style>
<main>
<h1>Pardosa · idle_scan</h1>
<div class="controls">
<button id="play" type="button">일시정지</button>
<label>방향 <select id="view"><option value="left">좌측</option><option value="right">우측</option></select></label>
<label>패스 <select id="pass"><option value="sprite">Sprite</option><option value="relit">재조명</option><option value="base">Base</option><option value="normal">Normal</option><option value="ao">AO</option><option value="rm">RM</option><option value="emissive">Emissive</option></select></label>
<label>배율 <select id="scale"><option selected>1</option><option>2</option><option>3</option></select></label>
<label>표시 fps <select id="fps"><option>10</option><option>15</option><option>20</option><option>30</option><option selected>60</option></select></label>
</div>
<div class="controls">
<label>프레임 <input id="frame" type="range" min="0" max="23" value="0"><output id="index">0</output></label>
<label>광원 방향 <input id="light" type="range" min="-180" max="180" value="-35"></label>
<label><input id="flat" type="checkbox">평탄 Normal</label>
</div>
<div class="stage"><canvas id="canvas" width="640" height="640" aria-label="늑대거미 대기 모션"></canvas></div>
<p class="status" id="status" role="status">이미지 로딩 중</p>
<small>P. agrestis 성체 암컷 · 체장 약 5mm · C011 체장비 5배 · idle-r02 시험 출력 · 시뮬레이션 효과 없음</small>
</main>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script id="images" type="application/json">__IMAGES__</script>
<script>
'use strict';
const manifest=JSON.parse(document.querySelector('#manifest').textContent);
const sources=JSON.parse(document.querySelector('#images').textContent);
const controls=Object.fromEntries(['play','view','pass','scale','fps','frame','index','light','flat','status'].map(id=>[id,document.getElementById(id)]));
const canvas=document.getElementById('canvas');
const context=canvas.getContext('2d');
context.imageSmoothingEnabled=false;
const scratch=document.createElement('canvas');
scratch.width=scratch.height=640;
const sampleContext=scratch.getContext('2d',{willReadFrequently:true});
const clip=manifest.clips.idle_scan;
let time=0,playing=true,lastTime=0,lastDraw=0,drawKey="";
const images={};
function frameAt(seconds){return Math.floor(((seconds%2+2)%2)*12+1e-9)%24;}
function readPass(view,pass,index){
  const [x,y,w,h]=clip.samples[index].views[view].rect;
  sampleContext.clearRect(0,0,640,640);
  sampleContext.drawImage(images[view+'_'+pass],x,y,w,h,0,0,640,640);
  return sampleContext.getImageData(0,0,640,640);
}
function linear(value){value/=255;return value<=0.04045?value/12.92:((value+.055)/1.055)**2.4;}
function srgb(value){value=Math.max(0,Math.min(1,value));return Math.round(255*(value<=.0031308?12.92*value:1.055*value**(1/2.4)-.055));}
function relight(view,index){
  const result=readPass(view,'sprite',index);
  const base=readPass(view,'base',index).data;
  const normals=readPass(view,'normal',index).data;
  const rm=readPass(view,'rm',index).data;
  const angle=Number(controls.light.value)*Math.PI/180;
  const lx=320+Math.sin(angle)*360,ly=-430+Math.cos(angle)*240;
  for(let i=0;i<result.data.length;i+=4){
    if(!base[i+3])continue;
    let x=normals[i]/255*2-1,y=normals[i+1]/255*2-1,z=normals[i+2]/255*2-1;
    if(controls.flat.checked){x=0;y=0;z=1;}
    const length=Math.hypot(x,y,z)||1;
    x/=length;y/=length;z/=length;
    const pixel=i/4,dx=lx-pixel%640,dy=ly+Math.floor(pixel/640);
    const d2=dx*dx+dy*dy+116*116,inv=1/Math.sqrt(d2);
    const a=dx*inv,c=dy*inv,d=116*inv;
    const ndl=Math.max(0,x*a+y*c+z*d),hnorm=1/Math.sqrt(2+2*d);
    const ndh=Math.min(1,Math.max(0,(x*a+y*c+z*(d+1))*hnorm));
    const roughness=Math.max(.1,rm[i]/255),metal=rm[i+1]/255,gloss=2/(roughness*roughness)-2;
    const attenuation=.82*1.32/(1+d2/32000);
    const specular=attenuation*ndl*(gloss+2)/8*ndh**gloss;
    const fresnel=(1-(1+d)*hnorm)**5;
    const diffuse=.34+attenuation*ndl*(1-metal)*.88;
    for(let channel=0;channel<3;channel++){
      const albedo=linear(base[i+channel]);
      const radiance=albedo*diffuse+specular*(fresnel+(.04*(1-metal)+albedo*metal)*(1-fresnel));
      result.data[i+channel]=srgb(Math.round(Math.min(1,Math.max(0,radiance))*4095)/4095);
    }
  }
  return result;
}
function draw(){
  const index=frameAt(time),view=controls.view.value,pass=controls.pass.value;
  const key=[index,view,pass,controls.light.value,controls.flat.checked,controls.scale.value,playing].join("/");
  if(key===drawKey)return;
  drawKey=key;
  context.putImageData(pass==='relit'?relight(view,index):readPass(view,pass,index),0,0);
  controls.frame.value=index;controls.index.value=index;
  canvas.style.width=canvas.style.height=(640*Number(controls.scale.value))+'px';
  controls.status.textContent='2초 루프 · 24표본 · 640 × 640px · '+(playing?'재생 중':'정지')+' · '+index+'/23';
}
controls.play.onclick=()=>{playing=!playing;controls.play.textContent=playing?'일시정지':'재생';draw();};
controls.frame.oninput=()=>{playing=false;controls.play.textContent='재생';time=Number(controls.frame.value)/12+1e-8;draw();};
for(const id of ['view','pass','scale','fps','light','flat'])controls[id].oninput=draw;
function tick(now){
  if(lastTime&&playing)time+=(now-lastTime)/1000;
  lastTime=now;
  if(now-lastDraw>=1000/Number(controls.fps.value)){draw();lastDraw=now;}
  requestAnimationFrame(tick);
}
Promise.all(Object.entries(sources).map(([key,url])=>new Promise((resolve,reject)=>{
  const image=new Image();image.onload=()=>{images[key]=image;resolve();};
  image.onerror=()=>reject(new Error(key));image.src=url;
}))).then(()=>{draw();requestAnimationFrame(tick);}).catch(error=>{controls.status.textContent='이미지 로딩 실패 '+error.message;});
</script>
</html>
